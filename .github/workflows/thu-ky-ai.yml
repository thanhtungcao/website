name: thu-ky-ai

on:
  push:
    paths: ["thu-ky-ai/**", ".github/workflows/thu-ky-ai.yml"]
  pull_request:
    paths: ["thu-ky-ai/**", ".github/workflows/thu-ky-ai.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thu-ky-ai/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg && pip install -r requirements.txt -r requirements-asr.txt -r requirements-bot.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: docker build -t thu-ky-ai .
